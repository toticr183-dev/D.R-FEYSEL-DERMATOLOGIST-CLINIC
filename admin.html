<!DOCTYPE html>
<html>
<head>
    <title>Dr. Feysel - Admin Dashboard</title>
    <style>
        /* Copy /* Beautiful admin styles */
        body { font-family: Arial; margin: 20px; background: #f5f9ff; }
        .header { background: linear-gradient(135deg, #0066cc, #004d99); color: white; padding: 25px; border-radius: 15px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); text-align: center; }
        .stat-number { font-size: 2.5em; font-weight: bold; color: #0066cc; }
        table { width: 100%; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        th { background: #0066cc; color: white; padding: 15px; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        .status-pending { background: #fff3cd; color: #856404; padding: 5px 12px; border-radius: 20px; }
        .status-confirmed { background: #d4edda; color: #155724; padding: 5px 12px; border-radius: 20px; }the admin panel CSS from my previous message */
        /* It's too long to repeat here, but use the one I sent earlier */
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍⚕️ Dr. Feysel Admin Dashboard</h1>
        <p>Managing appointments for Zenebework & Bole Clinics</p>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalAppointments">0</div>
            <div>Total Appointments</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingAppointments">0</div>
            <div>Pending</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="confirmedAppointments">0</div>
            <div>Confirmed</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="todayAppointments">0</div>
            <div>Today</div>
        </div>
    </div>
    
    <h2>📋 Recent Appointments</h2>
    <button onclick="loadAppointments()" style="padding:10px 20px; background:#0066cc; color:white; border:none; border-radius:5px; margin-bottom:20px;">
        🔄 Refresh
    </button>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Clinic</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="appointmentsTable">
            <!-- Data will load here -->
        </tbody>
    </table>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Use SAME credentials as your main site
        const SUPABASE_URL = 'https://iihgacjyaxtkvzpbprcq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DGfx4CeHnmtUPiYAKWiAg_WAhPz...'; // Same as main site
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        async function loadAppointments() {
            const { data, error } = await supabase
                .from('appointments')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error:', error);
                return;
            }
            
            updateStats(data);
            displayAppointments(data);
        }
        
        function updateStats(appointments) {
            const today = new Date().toISOString().split('T')[0];
            
            document.getElementById('totalAppointments').textContent = appointments.length;
            document.getElementById('pendingAppointments').textContent = 
                appointments.filter(a => a.status === 'pending').length;
            document.getElementById('confirmedAppointments').textContent = 
                appointments.filter(a => a.status === 'confirmed').length;
            document.getElementById('todayAppointments').textContent = 
                appointments.filter(a => a.appointment_date === today).length;
        }
        
        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointmentsTable');
            tbody.innerHTML = '';
            
            appointments.forEach(apt => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${apt.id}</td>
                    <td><strong>${apt.name}</strong>${apt.telegram ? `<br><small>@${apt.telegram}</small>` : ''}</td>
                    <td>${apt.phone}</td>
                    <td>${apt.clinic}</td>
                    <td>${apt.appointment_date}</td>
                    <td><span class="status-${apt.status}">${apt.status}</span></td>
                    <td>
                        <button onclick="updateStatus(${apt.id}, 'confirmed')" style="background:#28a745; color:white; border:none; padding:5px 10px; border-radius:3px; margin-right:5px;">
                            ✓ Confirm
                        </button>
                        <button onclick="updateStatus(${apt.id}, 'cancelled')" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:3px;">
                            ✗ Cancel
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
        
        async function updateStatus(id, status) {
            const { error } = await supabase
                .from('appointments')
                .update({ status })
                .eq('id', id);
            
            if (!error) {
                loadAppointments(); // Refresh
            }
        }
        
        // Load on page open
        loadAppointments();
        // Auto-refresh every 30 seconds
        setInterval(loadAppointments, 30000);
    </script>
   
</body>
</html>
