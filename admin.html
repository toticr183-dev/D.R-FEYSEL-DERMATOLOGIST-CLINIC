<!DOCTYPE html>
<html>
<head>
    <title>Dr. Feysel - Admin Panel</title>
    <style>
        /* Copy admin panel styles from earlier */
        body { font-family: Arial; margin: 20px; background: #f5f9ff; }
        .header { background: linear-gradient(135deg, #0066cc, #004d99); color: white; padding: 25px; border-radius: 15px; margin-bottom: 30px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); text-align: center; }
        .stat-number { font-size: 2.5em; font-weight: bold; color: #0066cc; }
        table { width: 100%; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        th { background: #0066cc; color: white; padding: 15px; text-align: left; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 0.9em; }
        .pending { background: #fff3cd; color: #856404; }
        .confirmed { background: #d4edda; color: #155724; }
        .cancelled { background: #f8d7da; color: #721c24; }
        button { padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-weight: 500; margin: 2px; }
        .btn-confirm { background: #28a745; color: white; }
        .btn-cancel { background: #dc3545; color: white; }
        .btn-refresh { background: #0066cc; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>👨‍⚕️ Dr. Feysel Admin Dashboard</h1>
        <p>PM2 Server: http://localhost:3003 | Total Appointments: <span id="totalCount">0</span></p>
    </div>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalAppointments">0</div>
            <div>Total</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingAppointments">0</div>
            <div>Pending</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="confirmedAppointments">0</div>
            <div>Confirmed</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="todayAppointments">0</div>
            <div>Today</div>
        </div>
    </div>
    
    <div style="margin: 20px 0;">
        <button class="btn-refresh" onclick="loadAppointments()">🔄 Refresh</button>
        <button onclick="exportToCSV()" style="background: #6c757d; color: white;">📊 Export CSV</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name & Contact</th>
                <th>Details</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="appointmentsTable">
            <!-- Data will load here -->
        </tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:3003/api';
        
        async function loadAppointments() {
            try {
                const response = await fetch(API_URL + '/admin/appointments');
                const appointments = await response.json();
                
                updateStats(appointments);
                displayAppointments(appointments);
            } catch (error) {
                alert('Error loading appointments: ' + error.message);
            }
        }
        
        function updateStats(appointments) {
            const today = new Date().toISOString().split('T')[0];
            
            document.getElementById('totalAppointments').textContent = appointments.length;
            document.getElementById('pendingAppointments').textContent = 
                appointments.filter(a => a.status === 'pending').length;
            document.getElementById('confirmedAppointments').textContent = 
                appointments.filter(a => a.status === 'confirmed').length;
            document.getElementById('todayAppointments').textContent = 
                appointments.filter(a => a.appointment_date === today).length;
            document.getElementById('totalCount').textContent = appointments.length;
        }
        
        function displayAppointments(appointments) {
            const tbody = document.getElementById('appointmentsTable');
            tbody.innerHTML = '';
            
            appointments.forEach(apt => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${apt.id}</td>
                    <td>
                        <strong>${apt.name}</strong><br>
                        📞 ${apt.phone}<br>
                        ${apt.telegram ? `📱 @${apt.telegram}` : ''}
                    </td>
                    <td>
                        Clinic: ${apt.clinic}<br>
                        Type: ${apt.appointment_type}<br>
                        ${apt.symptoms ? `Symptoms: ${apt.symptoms.substring(0, 50)}...` : ''}
                    </td>
                    <td>${apt.appointment_date}<br><small>${new Date(apt.created_at).toLocaleDateString()}</small></td>
                    <td><span class="status ${apt.status}">${apt.status}</span></td>
                    <td>
                        ${apt.status === 'pending' ? 
                            `<button class="btn-confirm" onclick="updateStatus(${apt.id}, 'confirmed')">✓ Confirm</button>
                             <button class="btn-cancel" onclick="updateStatus(${apt.id}, 'cancelled')">✗ Cancel</button>` :
                            `<button onclick="updateStatus(${apt.id}, 'pending')">↩ Reset</button>`
                        }
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        async function updateStatus(id, newStatus) {
            // Note: For PM2 server, you'd need to add update endpoint
            // For now, this is read-only
            alert('Update functionality requires backend modification. Currently read-only.');
            loadAppointments();
        }
        
        function exportToCSV() {
            alert('Export to CSV would be implemented with full backend.');
        }
        
        // Auto-refresh every 30 seconds
        loadAppointments();
        setInterval(loadAppointments, 30000);
    </script>
</body>
</html>
